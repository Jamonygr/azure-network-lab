    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091b30"/><stop offset="1" stop-color="#123b57"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#39c7ed"/><stop offset="1" stop-color="#78f0c7"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#91cae4" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
