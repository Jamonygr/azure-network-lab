<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Azure Network Lab</title>
  <desc id="desc">Learn the network. Trace the traffic. An Azure networking learning collection with five AZ-700 exam domains, seven scenario profiles, and seven standalone examples. Decorative connected nodes represent topics, not deployed infrastructure.</desc>
